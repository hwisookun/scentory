<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:28px;background:#F2FBF5;font-family:var(--font-sans);display:flex;flex-direction:column;gap:26px}
.row{display:flex;align-items:center;gap:32px;flex-wrap:wrap}

.mascot{width:140px;height:140px;filter:drop-shadow(0 12px 14px rgba(31,58,42,.18))}
.mascot.small{width:88px;height:88px}
.mascot.tiny{width:64px;height:64px}
.mascot svg{width:100%;height:100%;display:block;overflow:visible;animation:wob 3.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-4px) rotate(1.5deg)}}

/* wordmark: serif logotype */
.word{font-family:var(--font-serif);font-weight:900;font-size:64px;letter-spacing:-1.5px;line-height:.9;
  color:#1F3A2A;position:relative}
.word .dot{display:inline-block;width:14px;height:14px;background:#5A9E72;border-radius:9999px;vertical-align:baseline;margin-left:2px;box-shadow:0 2px 0 #3F7A53}
.word em{font-style:normal;color:#5A9E72}
.sub{font-size:11px;letter-spacing:3px;font-weight:700;color:#6B8A78;text-transform:uppercase;margin-top:4px}

.lockup{display:flex;align-items:center;gap:20px}
.stacked{display:flex;flex-direction:column;align-items:center;gap:8px}
.stacked .word{font-size:34px}
.stacked .sub{font-size:9px;letter-spacing:2px}

.app{width:112px;height:112px;border-radius:28px;padding:14px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 30% 20%,#E6F6EC 0%,#A8D5BA 55%,#5A9E72 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 -4px 0 rgba(47,92,63,.22) inset,0 14px 22px rgba(90,158,114,.4)}
.app svg{width:100%;height:100%}

.sticker{width:150px;height:150px;display:flex;align-items:center;justify-content:center;position:relative}
.sticker::before{content:"";position:absolute;inset:0;background:#fff;border-radius:9999px;
  box-shadow:0 0 0 4px #fff, 0 0 0 6px #5A9E72, 0 10px 20px rgba(90,158,114,.35)}
.sticker .inner{position:relative;width:118px;height:118px;border-radius:9999px;overflow:hidden;
  background:radial-gradient(circle at 40% 30%,#F0FAF3 0%,#CDEBD7 60%,#A8D5BA 100%);
  display:flex;align-items:center;justify-content:center;padding:10px;box-sizing:border-box}
.sticker .inner svg{width:100%;height:100%}
.sticker .ring{position:absolute;inset:-2px;pointer-events:none}
.sticker .ring text{font-family:var(--font-sans);font-size:11px;font-weight:800;letter-spacing:4px;fill:#1F3A2A}

.spec{margin-left:auto;font-family:ui-monospace,monospace;font-size:10px;color:#6B8A78;line-height:1.7;text-align:right}
.spec b{color:#3F7A53;font-weight:800}

.label{font-size:10px;letter-spacing:2px;font-weight:700;color:#6B8A78;text-transform:uppercase}
.block{display:flex;flex-direction:column;gap:8px;align-items:center}
</style></head><body>

<!-- ============ Mascot symbol: Sanrio-style egg + leaf ============ -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="hyangi" viewBox="0 0 200 200">
      <ellipse cx="100" cy="186" rx="48" ry="5" fill="#1F3A2A" opacity=".12"/>
      <path d="M100 28 C 56 28, 30 70, 30 118 C 30 162, 58 188, 100 188 C 142 188, 170 162, 170 118 C 170 70, 144 28, 100 28 Z"
        fill="#F2FBF5" stroke="#1F3A2A" stroke-width="3.6"/>
      <g transform="translate(100 26)">
        <path d="M0 4 Q -2 -2 2 -8" stroke="#1F3A2A" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M2 -8 Q 22 -16 22 -2 Q 14 6 2 -8 Z" fill="#7DBE91" stroke="#1F3A2A" stroke-width="3" stroke-linejoin="round"/>
        <path d="M4 -7 Q 12 -5 20 -3" stroke="#1F3A2A" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".5"/>
      </g>
      <circle cx="60" cy="118" r="10" fill="#FFB3A1" opacity=".85"/>
      <circle cx="140" cy="118" r="10" fill="#FFB3A1" opacity=".85"/>
      <circle cx="78" cy="106" r="7" fill="#1F3A2A"/>
      <circle cx="122" cy="106" r="7" fill="#1F3A2A"/>
      <path d="M93 128 Q 100 138 107 128" stroke="#1F3A2A" stroke-width="3.6" fill="none" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>

<!-- ============ LOCKUPS ============ -->

<div class="row">
  <div class="block">
    <span class="label">Primary lockup</span>
    <div class="lockup">
      <div class="mascot"><svg viewBox="0 0 200 200"><use href="#hyangi"/></svg></div>
      <div>
        <div class="word"><em>맡</em>다<span class="dot"></span></div>
        <div class="sub">Matda · 향을 맡다</div>
      </div>
    </div>
  </div>

  <div class="spec">
    mascot: <b>향이</b> — egg + leaf · Sanrio-style<br/>
    thick 3.6px outline · flat fills · 4 details only<br/>
    palette: <b>#1F3A2A · #F2FBF5 · #7DBE91 · #FFB3A1</b><br/>
    wordmark: serif 900, dot = 향 droplet
  </div>
</div>

<div class="row">
  <div class="block">
    <span class="label">Stacked</span>
    <div class="stacked">
      <div class="mascot small"><svg viewBox="0 0 200 200"><use href="#hyangi"/></svg></div>
      <div class="word"><em>맡</em>다<span class="dot" style="width:8px;height:8px"></span></div>
      <div class="sub">MATDA</div>
    </div>
  </div>

  <div class="block">
    <span class="label">App icon</span>
    <div class="app"><svg viewBox="0 0 200 200"><use href="#hyangi"/></svg></div>
  </div>

  <div class="block">
    <span class="label">Sticker</span>
    <div class="sticker">
      <div class="inner"><svg viewBox="0 0 200 200"><use href="#hyangi"/></svg></div>
      <svg class="ring" viewBox="0 0 150 150">
        <defs>
          <path id="curv" d="M 75 75 m -60 0 a 60 60 0 1 1 120 0 a 60 60 0 1 1 -120 0"/>
        </defs>
        <text><textPath href="#curv" startOffset="0">맡다 · MATDA · 향이 · HYANG-I · </textPath></text>
      </svg>
    </div>
  </div>

  <div class="block">
    <span class="label">Tiny avatar</span>
    <div style="width:72px;height:72px;border-radius:9999px;background:#F0FAF3;border:2px solid #5A9E72;display:flex;align-items:center;justify-content:center;padding:6px;box-sizing:border-box;box-shadow:0 6px 12px rgba(90,158,114,.35)">
      <svg viewBox="0 0 200 200" style="width:100%;height:100%"><use href="#hyangi"/></svg>
    </div>
  </div>
</div>

</body></html>
