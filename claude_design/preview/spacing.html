<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:22px;background:#fff;display:flex;align-items:center;gap:16px;font-family:var(--font-sans)}
.stack{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px}
.bar{background:#5E9E82;border-radius:9999px;height:14px}
.l{width:36px;font-size:11px;color:var(--text-light);font-family:ui-monospace,monospace}
.v{width:44px;font-size:11px;color:var(--text-secondary);font-family:ui-monospace,monospace;text-align:right}
</style></head><body>
<div class="stack" style="flex:1">
  <div class="row"><span class="l">xs</span><div class="bar" style="width:4px"></div><span class="v">4px</span></div>
  <div class="row"><span class="l">sm</span><div class="bar" style="width:8px"></div><span class="v">8px</span></div>
  <div class="row"><span class="l">md</span><div class="bar" style="width:16px"></div><span class="v">16px</span></div>
  <div class="row"><span class="l">lg</span><div class="bar" style="width:24px"></div><span class="v">24px</span></div>
  <div class="row"><span class="l">xl</span><div class="bar" style="width:32px"></div><span class="v">32px</span></div>
  <div class="row"><span class="l">xxl</span><div class="bar" style="width:48px"></div><span class="v">48px</span></div>
</div>
</body></html>
