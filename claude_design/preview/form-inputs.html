<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:22px;background:#F6FBF8;font-family:var(--font-sans);display:flex;flex-direction:column;gap:10px}
.input{background:#fff;border-radius:14px;padding:13px 16px;display:flex;align-items:center;gap:10px;
  border:1.5px solid #E0EBE5;box-shadow:0 1px 3px rgba(46,64,54,.04);min-height:46px;box-sizing:border-box}
.input.focus{border-color:#A8D5BA;box-shadow:0 0 0 3px rgba(168,213,186,.25), 0 1px 3px rgba(46,64,54,.04)}
.input .ph{color:#8A9C95;font-size:14px;flex:1}
.input .caret{width:1.5px;height:18px;background:#6FB88F;animation:blink 1.1s infinite}
@keyframes blink { 50%{opacity:0} }
.ic{display:inline-flex;align-items:center;justify-content:center;color:#8A9C95}
.ic svg{width:18px;height:18px;fill:currentColor}

.list{background:#fff;border-radius:14px;border:1.5px solid #E0EBE5;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;
  box-shadow:0 1px 3px rgba(46,64,54,.04);min-height:52px;box-sizing:border-box}
.list.sel{background:#F0F8F3;border-color:#A8D5BA;box-shadow:0 0 0 3px rgba(168,213,186,.22), 0 1px 3px rgba(46,64,54,.04)}
.lbl{font-size:15px;font-weight:600;color:#1A2E24;letter-spacing:-.2px}
.sel .lbl{color:#3E7E62;font-weight:700}
.desc{font-size:12px;color:#6B7C75;margin-top:2px}
.radio{width:22px;height:22px;border-radius:9999px;border:1.5px solid #D4DDD8;flex-shrink:0}
.sel .radio{border-color:#6FB88F;background:#6FB88F;display:flex;align-items:center;justify-content:center;color:#fff}
.sel .radio svg{width:12px;height:12px;fill:#fff}
</style></head><body>

<div class="input focus">
  <span class="ic"><svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 015.9 12.13l4.74 4.73-1.41 1.41-4.73-4.74A7.5 7.5 0 1110.5 3zm0 2a5.5 5.5 0 100 11 5.5 5.5 0 000-11z"/></svg></span>
  <span class="ph">향수명, 브랜드, 원료 검색</span>
  <span class="caret"></span>
</div>

<div class="list"><div><div class="lbl">5~15만원</div><div class="desc">다양한 브랜드, 합리적인 선택</div></div><span class="radio"></span></div>

<div class="list sel"><div><div class="lbl">15~30만원</div><div class="desc">고급 브랜드, 퀄리티 있는 향</div></div>
  <span class="radio"><svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></span>
</div>

</body></html>
