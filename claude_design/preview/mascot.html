<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:40px;background:linear-gradient(135deg,#F2FBF5 0%,#DDF1E3 100%);font-family:var(--font-sans);
  display:flex;gap:48px;align-items:center;flex-wrap:wrap;min-height:100vh;box-sizing:border-box}

.stage{position:relative;width:260px;height:280px;display:flex;align-items:center;justify-content:center}
.glow{position:absolute;inset:30px;background:radial-gradient(circle,#BFE3CB 0%,transparent 70%);filter:blur(20px);z-index:0}

.wrap{position:relative;width:220px;height:220px;z-index:1;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 12px 14px rgba(31,58,42,.18))}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-5px) rotate(1deg)}}
.wrap svg{width:100%;height:100%;display:block;overflow:visible}

.meta{display:flex;flex-direction:column;gap:10px;max-width:340px}
.label{font-size:11px;letter-spacing:3px;font-weight:700;color:#3F7A53;text-transform:uppercase}
.name{font-family:var(--font-serif);font-size:42px;font-weight:900;letter-spacing:-1px;color:#1F3A2A;line-height:1}
.name em{font-style:normal;color:#5A9E72}
.tagline{font-size:13px;color:#557867;line-height:1.6}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips span{font-size:10px;font-weight:800;padding:5px 11px;border-radius:9999px;color:#fff}
.c1{background:#1F3A2A}.c2{background:#A8D5BA;color:#1F3A2A}.c3{background:#5A9E72}.c4{background:#FFB3A1;color:#7A3E2A}
.note{font-size:11px;color:#557867;line-height:1.6;margin-top:4px;border-top:1px dashed #A8D5BA;padding-top:10px}
.note b{color:#1F3A2A}
</style></head><body>

<div class="stage">
  <div class="glow"></div>

  <div class="wrap">
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- ground shadow -->
    <ellipse cx="100" cy="186" rx="48" ry="5" fill="#1F3A2A" opacity=".12"/>

    <!-- ==== BODY: simple egg silhouette, flat color, thick outline ==== -->
    <path d="M100 28
             C 56 28, 30 70, 30 118
             C 30 162, 58 188, 100 188
             C 142 188, 170 162, 170 118
             C 170 70, 144 28, 100 28 Z"
          fill="#F2FBF5"
          stroke="#1F3A2A"
          stroke-width="3.6"/>

    <!-- ==== LEAF ON HEAD (single signature accent) ==== -->
    <g transform="translate(100 26)">
      <!-- stem -->
      <path d="M0 4 Q -2 -2 2 -8" stroke="#1F3A2A" stroke-width="3" stroke-linecap="round" fill="none"/>
      <!-- leaf shape -->
      <path d="M2 -8 Q 22 -16 22 -2 Q 14 6 2 -8 Z"
            fill="#7DBE91" stroke="#1F3A2A" stroke-width="3" stroke-linejoin="round"/>
      <!-- leaf vein -->
      <path d="M4 -7 Q 12 -5 20 -3" stroke="#1F3A2A" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".5"/>
    </g>

    <!-- ==== BLUSH (soft peach circles) ==== -->
    <circle cx="60" cy="118" r="10" fill="#FFB3A1" opacity=".85"/>
    <circle cx="140" cy="118" r="10" fill="#FFB3A1" opacity=".85"/>

    <!-- ==== EYES: tiny solid dots ==== -->
    <circle cx="78" cy="106" r="7" fill="#1F3A2A"/>
    <circle cx="122" cy="106" r="7" fill="#1F3A2A"/>

    <!-- ==== MOUTH: tiny rounded smile ==== -->
    <path d="M93 128 Q 100 138 107 128"
          stroke="#1F3A2A"
          stroke-width="3.6"
          fill="none"
          stroke-linecap="round"/>
  </svg>
  </div>
</div>

<div class="meta">
  <div class="label">Brand mascot</div>
  <div class="name"><em>향</em>이 · Hyang-i</div>
  <div class="tagline">달걀 모양 통통한 몸 위에 잎사귀 하나, 점 두 개 눈, 짧은 미소. 그게 전부. 산리오 캐릭터처럼 굵은 외곽선과 평면 컬러로 단순하지만 임팩트 있게.</div>
  <div class="chips">
    <span class="c1">#1F3A2A outline</span>
    <span class="c2">#F2FBF5 body</span>
    <span class="c3">#7DBE91 leaf</span>
    <span class="c4">#FFB3A1 blush</span>
  </div>
  <div class="note">
    <b>구성 원칙</b>: 굵은 3.6px 외곽선 · 평면 컬러 (그라데이션 ❌) · 디테일 4개로 제한 (잎사귀 · 눈 · 입 · 볼) · 좌우 대칭. <br/>
    <b>크기 변형</b>: 16px 파비콘에서도 잎+눈+입이 식별되어야 함.
  </div>
</div>

</body></html>
