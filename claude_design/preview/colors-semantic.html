<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:22px;background:#fff;display:flex;gap:12px;flex-wrap:wrap;font-family:var(--font-sans)}
.sw{border-radius:12px;width:140px;aspect-ratio:1.4/1;padding:10px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;box-shadow:var(--shadow-sm)}
.n{font-size:11px;font-weight:700}.h{font-size:10px;font-family:ui-monospace,monospace;opacity:.85}
</style></head><body>
<div class="sw" style="background:#43A047"><span class="n">success</span><span class="h">#43A047</span></div>
<div class="sw" style="background:#FB8C00"><span class="n">warning</span><span class="h">#FB8C00</span></div>
<div class="sw" style="background:#E53935"><span class="n">error</span><span class="h">#E53935</span></div>
<div class="sw" style="background:#FFB800"><span class="n">star</span><span class="h">#FFB800</span></div>
<div class="sw" style="background:#FEE500;color:#1A1A1A"><span class="n">kakao</span><span class="h">#FEE500</span></div>
<div class="sw" style="background:#03C75A"><span class="n">naver</span><span class="h">#03C75A</span></div>
</body></html>
