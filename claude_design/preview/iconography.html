<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:22px;background:#fff;font-family:var(--font-sans);display:grid;grid-template-columns:repeat(8,1fr);gap:14px;text-align:center}
.ic{display:flex;flex-direction:column;align-items:center;gap:4px}
.ic svg{width:22px;height:22px;stroke:#1A2E24;stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ic.p svg{stroke:#5E9E82}
.ic.a svg{stroke:#FF8A70;fill:#FF8A70}
.lb{font-size:10px;color:var(--text-secondary);font-family:ui-monospace,monospace}
</style></head><body>

</body></html>
