<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:#F6FBF8;font-family:var(--font-sans);display:flex;gap:16px;flex-wrap:wrap}

.card{background:#fff;border-radius:22px;overflow:hidden;width:210px;flex-shrink:0;
  box-shadow:0 1px 2px rgba(46,64,54,.04), 0 8px 18px rgba(46,64,54,.06);
  border:1px solid rgba(111,184,143,.10);transition:transform .2s ease, box-shadow .2s ease;cursor:pointer}
.card:hover{transform:translateY(-2px);box-shadow:0 1px 2px rgba(46,64,54,.04), 0 14px 24px rgba(46,64,54,.10)}

.img{height:180px;background:linear-gradient(145deg,#F0F8F3 0%,#DCF1E2 100%);position:relative;display:flex;align-items:center;justify-content:center}
.bottle{width:58px;height:84px;position:relative}
.bottle .cap{position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:10px;background:rgba(31,74,53,.55);border-radius:3px}
.bottle .collar{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:34px;height:5px;background:rgba(31,74,53,.35);border-radius:1px}
.bottle .body{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:52px;height:70px;background:rgba(31,74,53,.22);border-radius:8px;backdrop-filter:blur(2px)}
.bottle .shine{position:absolute;top:20px;left:8px;width:10px;height:48px;background:#fff;opacity:.45;border-radius:9999px;filter:blur(1px)}

.niche{position:absolute;top:10px;left:10px;background:#5A9E72;color:#fff;font-size:10px;font-weight:800;
  padding:4px 8px;border-radius:8px;letter-spacing:.3px;box-shadow:0 2px 4px rgba(63,122,44,.2)}

.heart{position:absolute;top:10px;right:10px;background:#fff;width:32px;height:32px;border-radius:9999px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(46,64,54,.12);cursor:pointer;border:none}
.heart svg{width:16px;height:16px}

.info{padding:14px 14px 14px}

.eyebrow{font-size:10px;color:#3E7E62;font-weight:800;text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px}

.name{font-size:15px;font-weight:800;color:#1A2E24;line-height:1.3;letter-spacing:-.3px;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.sub{font-size:11px;color:#8A9C95;font-weight:500;margin-top:2px;margin-bottom:10px}

.tags{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:9999px;letter-spacing:-.1px}

.divider{height:1px;background:#EBF2EE;margin:0 -14px 10px}

.foot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.foot .rating{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:#6B7C75;font-weight:700;padding-bottom:1px}
.star{color:#FFB800;font-size:12px}
.rating .count{color:#B0BDB8;font-weight:500}

.price-col{text-align:right;margin-left:auto}
.price-lbl{display:block;font-size:9px;font-weight:700;color:#8A9C95;letter-spacing:.5px;text-transform:uppercase;margin-bottom:1px}
.price{font-size:16px;font-weight:900;color:#1A2E24;letter-spacing:-.4px;line-height:1}
.price small{font-size:11px;font-weight:700;color:#6B7C75;margin-left:1px}
</style></head><body>

<div class="card">
  <div class="img">
    <div class="bottle"><div class="cap"></div><div class="collar"></div><div class="body"></div><div class="shine"></div></div>
    <span class="niche">니치</span>
    <button class="heart"><svg viewBox="0 0 24 24" fill="#FF8A70"><path d="M12 21s-7-4.5-7-10a4.5 4.5 0 017.1-3.6A4.5 4.5 0 0119 11c0 5.5-7 10-7 10z"/></svg></button>
  </div>
  <div class="info">
    <div class="eyebrow">Byredo</div>
    <div class="name">Gypsy Water</div>
    <div class="sub">집시 워터 · EDP</div>
    <div class="tags">
      <span class="tag" style="background:#EADFCF;color:#6E4B2E">우디</span>
      <span class="tag" style="background:#D9ECCF;color:#3F7A2C">허벌</span>
    </div>
    <div class="divider"></div>
    <div class="foot">
      <span class="rating"><span class="star">★</span>4.7<span class="count">(1.2k)</span></span>
      <div class="price-col">
        <span class="price-lbl">50ml</span>
        <span class="price">265,000<small>원</small></span>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="img">
    <div class="bottle" style="filter:hue-rotate(-15deg)"><div class="cap"></div><div class="collar"></div><div class="body" style="background:rgba(201,66,119,.22)"></div><div class="shine"></div></div>
    <button class="heart"><svg viewBox="0 0 24 24" fill="none" stroke="#B0BDB8" stroke-width="2"><path d="M16.5 4.5a4.5 4.5 0 014.5 4.5c0 5.5-9 12-9 12S3 15 3 9a4.5 4.5 0 018.5-2A4.5 4.5 0 0116.5 4.5z"/></svg></button>
  </div>
  <div class="info">
    <div class="eyebrow">Jo Malone London</div>
    <div class="name">Peony &amp; Blush Suede</div>
    <div class="sub">피오니 앤 블러쉬 스웨이드 · EDC</div>
    <div class="tags">
      <span class="tag" style="background:#FBDCE8;color:#C94277">플로럴</span>
      <span class="tag" style="background:#F7DDE6;color:#A8396A">파우더리</span>
    </div>
    <div class="divider"></div>
    <div class="foot">
      <span class="rating"><span class="star">★</span>4.5<span class="count">(2.8k)</span></span>
      <div class="price-col">
        <span class="price-lbl">100ml</span>
        <span class="price">198,000<small>원</small></span>
      </div>
    </div>
  </div>
</div>

</body></html>
