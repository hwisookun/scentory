<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:26px;background:#F6FBF8;font-family:var(--font-sans);display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{font-family:inherit;font-size:14px;cursor:pointer;border:none;letter-spacing:-.2px;transition:transform .15s ease, box-shadow .2s ease, background .2s ease;}
button:active{transform:scale(.98)}

/* Primary — soft-hero pill, gradient + inset highlight for depth */
.primary{background:linear-gradient(180deg,#BCE0CA 0%,#A8D5BA 100%);color:#1F4A35;padding:14px 24px;border-radius:14px;font-weight:700;min-height:48px;
  box-shadow:0 1px 0 rgba(255,255,255,.65) inset, 0 -2px 0 rgba(63,122,44,.14) inset, 0 6px 14px rgba(111,184,143,.35);}
.primary:hover{filter:brightness(1.02);box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 -2px 0 rgba(63,122,44,.14) inset, 0 8px 18px rgba(111,184,143,.45)}

.outline{background:#fff;color:#3E7E62;padding:14px 22px;border-radius:14px;font-weight:700;border:1.5px solid #C4E3D0;min-height:48px;
  box-shadow:0 1px 0 rgba(255,255,255,.8) inset, 0 2px 6px rgba(46,64,54,.05)}
.outline:hover{background:#F0F8F3;border-color:#A8D5BA}

.ghost{background:transparent;color:#6B7C75;padding:12px 16px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;gap:6px;border-radius:12px}
.ghost:hover{background:#F0F8F3;color:#3E7E62}

.pill{background:linear-gradient(180deg,#BCE0CA 0%,#A8D5BA 100%);color:#1F4A35;padding:10px 18px;border-radius:9999px;font-weight:700;font-size:13px;
  box-shadow:0 1px 0 rgba(255,255,255,.65) inset, 0 3px 8px rgba(111,184,143,.28);min-height:40px}

.disabled{background:#E3EBE7;color:#9AACA4;padding:14px 24px;border-radius:14px;font-weight:700;min-height:48px;cursor:not-allowed;box-shadow:none}

.kakao{background:#FEE500;color:#1A1A1A;padding:14px 22px;border-radius:14px;font-weight:700;min-height:48px;display:inline-flex;gap:10px;align-items:center;
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 4px 10px rgba(254,229,0,.35)}
.kakao .ic{width:22px;height:22px;border-radius:6px;background:#1A1A1A;display:inline-flex;align-items:center;justify-content:center}
.kakao .ic svg{width:14px;height:14px;fill:#FEE500}

.naver{background:#03C75A;color:#fff;padding:14px 22px;border-radius:14px;font-weight:700;min-height:48px;display:inline-flex;gap:10px;align-items:center;
  box-shadow:0 1px 0 rgba(255,255,255,.25) inset, 0 4px 10px rgba(3,199,90,.3)}
.naver .ic{width:22px;height:22px;border-radius:6px;background:#fff;color:#03C75A;font-weight:900;font-size:12px;display:inline-flex;align-items:center;justify-content:center}

.accent{background:linear-gradient(180deg,#FFC6B8 0%,#FFB3A1 100%);color:#8C2D15;padding:10px 18px;border-radius:9999px;font-weight:700;font-size:13px;
  box-shadow:0 1px 0 rgba(255,255,255,.55) inset, 0 3px 8px rgba(255,138,112,.3);min-height:40px;display:inline-flex;gap:6px;align-items:center}
.accent svg{width:14px;height:14px;fill:currentColor}
</style></head><body>
<div class="row">
  <button class="primary">다음</button>
  <button class="outline">내 컬렉션</button>
  <button class="ghost">우선 들어갈래요 →</button>
  <button class="disabled" disabled>다음</button>
</div>
<div class="row">
  <button class="pill">한줄평 쓰기</button>
  <button class="accent"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-7-10a4.5 4.5 0 017.1-3.6A4.5 4.5 0 0119 11c0 5.5-7 10-7 10z"/></svg>위시에 담기</button>
  <button class="kakao"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3C6.5 3 2 6.5 2 10.9c0 2.8 1.9 5.2 4.7 6.6-.2.7-.7 2.7-.8 3.1-.1.6.2.6.5.4.2-.1 3.1-2.1 4.4-3 .4 0 .8.1 1.2.1 5.5 0 10-3.5 10-7.9S17.5 3 12 3z"/></svg></span>카카오로 계속하기</button>
  <button class="naver"><span class="ic">N</span>네이버로 계속하기</button>
</div>
</body></html>
