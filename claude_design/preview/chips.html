<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:22px;background:#F7FAF8;font-family:var(--font-sans);display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:10px 16px;border-radius:9999px;background:#fff;border:1.5px solid #E0EBE5;font-size:14px;font-weight:600;color:#1A2E24;box-shadow:0 1px 4px rgba(26,46,36,.06);min-height:44px;box-sizing:border-box}
.chip.sel{background:#5E9E82;border-color:#5E9E82;color:#fff;font-weight:700}
.niche{font-size:9px;color:#5E9E82;background:#EBF7F1;padding:1px 4px;border-radius:4px;font-weight:700}
.sel .niche{color:#fff;background:rgba(255,255,255,.25)}
</style></head><body>
<span class="chip">일상용</span>
<span class="chip sel">데이트</span>
<span class="chip">직장·비즈니스</span>
<span class="chip">선물</span>
<span class="chip sel">Byredo <span class="niche">니치</span></span>
<span class="chip">Jo Malone <span class="niche">니치</span></span>
<span class="chip">플로럴</span>
<span class="chip sel">시트러스</span>
</body></html>
