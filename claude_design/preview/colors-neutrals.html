<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:#fff;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;font-family:var(--font-sans)}
.sw{border-radius:10px;aspect-ratio:1.4/1;padding:8px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow-sm)}
.name{font-size:11px;font-weight:700}
.hex{font-size:9px;font-family:ui-monospace,monospace;opacity:.7}
</style></head><body>
<div class="sw" style="background:#F7FAF8;color:#1A2E24;border:1px solid #E0EBE5"><span class="name">background</span><span class="hex">#F7FAF8</span></div>
<div class="sw" style="background:#F4F6F5;color:#1A2E24"><span class="name">gray-100</span><span class="hex">#F4F6F5</span></div>
<div class="sw" style="background:#E8EDEA;color:#1A2E24"><span class="name">gray-200</span><span class="hex">#E8EDEA</span></div>
<div class="sw" style="background:#D4DDD8;color:#1A2E24"><span class="name">gray-300</span><span class="hex">#D4DDD8</span></div>
<div class="sw" style="background:#B0BDB8;color:#fff"><span class="name">gray-400</span><span class="hex">#B0BDB8</span></div>
<div class="sw" style="background:#8A9C95;color:#fff"><span class="name">gray-500</span><span class="hex">#8A9C95</span></div>
<div class="sw" style="background:#6B7C75;color:#fff"><span class="name">gray-600</span><span class="hex">#6B7C75</span></div>
<div class="sw" style="background:#556560;color:#fff"><span class="name">gray-700</span><span class="hex">#556560</span></div>
<div class="sw" style="background:#3E4E48;color:#fff"><span class="name">gray-800</span><span class="hex">#3E4E48</span></div>
<div class="sw" style="background:#1A2E24;color:#fff"><span class="name">text / black</span><span class="hex">#1A2E24</span></div>
</body></html>
