<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:28px;background:#F7FAF8;display:flex;gap:26px;align-items:center;justify-content:center;font-family:var(--font-sans)}
.c{width:120px;height:90px;background:#fff;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.sm{box-shadow:0 1px 4px rgba(26,46,36,.06)}
.md{box-shadow:0 4px 8px rgba(26,46,36,.10)}
.lg{box-shadow:0 8px 16px rgba(26,46,36,.15)}
.n{font-size:12px;font-weight:700;color:#1A2E24}
.v{font-size:10px;color:var(--text-light);font-family:ui-monospace,monospace;text-align:center}
</style></head><body>
<div class="c sm"><span class="n">sm</span><span class="v">0 1 4 · 6%</span></div>
<div class="c md"><span class="n">md</span><span class="v">0 4 8 · 10%</span></div>
<div class="c lg"><span class="n">lg</span><span class="v">0 8 16 · 15%</span></div>
</body></html>
