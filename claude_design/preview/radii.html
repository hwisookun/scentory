<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:22px;background:#fff;display:flex;gap:16px;align-items:center;font-family:var(--font-sans)}
.box{width:92px;height:92px;background:#EBF7F1;border:1.5px solid #E0EBE5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.n{font-size:11px;font-weight:700;color:#3E7E62}
.v{font-size:10px;color:var(--text-light);font-family:ui-monospace,monospace}
</style></head><body>
<div class="box" style="border-radius:8px"><span class="n">sm</span><span class="v">8px</span></div>
<div class="box" style="border-radius:12px"><span class="n">md</span><span class="v">12px</span></div>
<div class="box" style="border-radius:16px"><span class="n">lg</span><span class="v">16px</span></div>
<div class="box" style="border-radius:24px"><span class="n">xl</span><span class="v">24px</span></div>
<div class="box" style="border-radius:9999px"><span class="n">full</span><span class="v">9999</span></div>
</body></html>
