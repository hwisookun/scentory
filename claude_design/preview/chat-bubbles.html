<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:20px;background:#F7FAF8;font-family:var(--font-sans);display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-end}
.av{width:32px;height:32px;flex-shrink:0;filter:drop-shadow(0 1px 3px rgba(31,58,42,.18))}
.av svg{width:100%;height:100%;display:block;overflow:visible}
.b{max-width:76%;padding:10px 16px;border-radius:16px;font-size:14px;line-height:1.5}
.bot{background:#fff;border-bottom-left-radius:4px;color:#1A2E24;box-shadow:0 1px 4px rgba(26,46,36,.06)}
.user{background:#6FB88F;border-bottom-right-radius:4px;color:#fff;margin-left:auto}
.end{justify-content:flex-end}
</style></head><body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="hy" viewBox="0 0 200 200">
      <path d="M100 28 C 56 28, 30 70, 30 118 C 30 162, 58 188, 100 188 C 142 188, 170 162, 170 118 C 170 70, 144 28, 100 28 Z" fill="#F2FBF5" stroke="#1F3A2A" stroke-width="6"/>
      <g transform="translate(100 26)">
        <path d="M0 4 Q -2 -2 2 -8" stroke="#1F3A2A" stroke-width="5" stroke-linecap="round" fill="none"/>
        <path d="M2 -8 Q 22 -16 22 -2 Q 14 6 2 -8 Z" fill="#7DBE91" stroke="#1F3A2A" stroke-width="5" stroke-linejoin="round"/>
      </g>
      <circle cx="60" cy="118" r="10" fill="#FFB3A1" opacity=".85"/>
      <circle cx="140" cy="118" r="10" fill="#FFB3A1" opacity=".85"/>
      <circle cx="78" cy="106" r="9" fill="#1F3A2A"/>
      <circle cx="122" cy="106" r="9" fill="#1F3A2A"/>
      <path d="M93 128 Q 100 138 107 128" stroke="#1F3A2A" stroke-width="5" fill="none" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>

<div class="msg"><div class="av"><svg viewBox="0 0 200 200"><use href="#hy"/></svg></div><div class="b bot">안녕하세요! 저는 향이예요 🌿<br/>향수에 대해 뭐든 물어보세요.</div></div>
<div class="msg end"><div class="b user">데이트에 좋은 향수 추천해줘</div></div>
</body></html>
