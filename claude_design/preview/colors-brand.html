<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:#fff;display:grid;grid-template-columns:repeat(5,1fr);gap:14px;font-family:var(--font-sans)}
.sw{border-radius:14px;aspect-ratio:1.4/1;padding:12px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow-sm);border:1px solid rgba(111,184,143,.08)}
.name{font-size:12px;font-weight:800;letter-spacing:-.2px}
.hex{font-size:10px;font-family:ui-monospace,monospace;opacity:.8;font-weight:600}
</style></head><body>
<div class="sw" style="background:#A8D5BA;color:#22503A"><span class="name">primary</span><span class="hex">#A8D5BA</span></div>
<div class="sw" style="background:#D4EDE0;color:#3E7E62"><span class="name">primary-light</span><span class="hex">#D4EDE0</span></div>
<div class="sw" style="background:#6FB88F;color:#fff"><span class="name">primary-dark</span><span class="hex">#6FB88F</span></div>
<div class="sw" style="background:#F0F8F3;color:#3E7E62"><span class="name">secondary</span><span class="hex">#F0F8F3</span></div>
<div class="sw" style="background:#FFB3A1;color:#A84027"><span class="name">accent</span><span class="hex">#FFB3A1</span></div>
</body></html>
